<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-labelledby="c03-title c03-desc" data-animated="cycling">
  <title id="c03-title">Pelican riding a bicycle 3</title>
  <desc id="c03-desc">A pelican pedals at an unhurried pace. Its wheels turn, its feet follow the pedals, and its body gently rocks. A reset is announced. There is no rush.</desc>

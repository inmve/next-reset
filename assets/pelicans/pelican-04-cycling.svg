<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-labelledby="c04-title c04-desc" data-animated="cycling">
  <title id="c04-title">Pelican riding a bicycle 4</title>
  <desc id="c04-desc">A pelican pedals at an unhurried pace. Its wheels turn, its feet follow the pedals, and its body gently rocks. A reset is announced. There is no rush.</desc>

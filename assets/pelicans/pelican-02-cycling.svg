<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none" role="img" aria-labelledby="c02-title c02-desc" data-animated="cycling">
  <title id="c02-title">Pelican riding a bicycle 2</title>
  <desc id="c02-desc">A pelican pedals at an unhurried pace. Its wheels turn, its feet follow the pedals, and its body gently rocks. A reset is announced. There is no rush.</desc>
